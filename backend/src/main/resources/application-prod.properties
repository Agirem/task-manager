# Cloud Run -> Cloud SQL via the native connector (no public IP exposure).
spring.datasource.url=jdbc:mysql:///${SPRING_DATASOURCE_NAME}?cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.mysql.SocketFactory
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
